name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the deploy job only needs to read the repo (it FTPs out).
permissions:
  contents: read

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a commit SHA (not a movable tag) so a
      # compromised or re-pointed tag can't inject code into the deploy.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/images/peoperty_1/WhatsApp Image*
